services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ginantaka
      POSTGRES_PASSWORD: ginantaka
      POSTGRES_DB: ginantaka_shoes
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ginantaka -d ginantaka_shoes"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
